<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>摸魚模式(搞笑版)</title>
<style>
:root{--bg:#33ca33;--taginkc:#000;--ink:#000;--font:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;--tagfont:"Kaiti TC","BiauKai","DFKai-SB",serif;--serialfont:-apple-system,"Helvetica Neue",Arial,sans-serif;--tagbg:none;box-sizing:border-box;padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);overflow-x:hidden}
header{background:#000;color:#fff;text-align:center;font-weight:600;font-size:1.2rem;padding:calc(16px + env(safe-area-inset-top,0px)) 16px 16px;position:relative;z-index:10}
.menu{position:absolute;left:16px;bottom:12px;width:36px;height:36px;border-radius:50%;background:#1c1c1e;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:4px;cursor:pointer}
.menu i{display:block;width:20px;height:3px;background:#fff;border-radius:2px}
.ver{text-align:right;font-size:1.15rem;font-weight:500;padding:2px 12px 0 0;line-height:1.1}
main{max-width:520px;margin:0 auto;padding:0 20px 40px;text-align:center}
.end{white-space:normal;font-size:min(2.4rem,6.6vw);font-weight:400;margin:0 0 68px;line-height:1.15;word-break:break-word}
.end.small-text{font-size:min(1.6rem, 4.5vw)}
.mode{font-size:4.5rem;font-weight:500;line-height:1.1;margin:0 0 60px;letter-spacing:.02em}
.clock{white-space:nowrap;font-size:min(2.8rem,8.2vw);font-weight:800;font-variant-numeric:tabular-nums;margin:0 0 16px}
.btn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;border:0;border-radius:14px;background:#8fcc8f;font:inherit;font-weight:600;font-size:1.3rem;padding:2px 18px;margin:0 auto 14px;cursor:pointer}
.btn .dot{width:16px;height:16px;border-radius:50%}
#lockBtn{color:#5f7d5a}#lockBtn .dot{background:#50cc50}
#unlockBtn{color:#1E6EF3}#unlockBtn .dot{background:#e63946}
.tag{position:relative;margin:20px auto;width:85%;background:#33ca33 var(--tagbg) center/cover no-repeat;border:1px solid transparent;border-radius:16px;padding:14px 10px;overflow:hidden}
.tag .t1,.tag .t2,.tag .sn{color:var(--taginkc)}
.tag .t1{font-family:var(--tagfont);font-size:1.6rem;letter-spacing:1px}
.tag .t2{font-family:var(--tagfont);font-size:1.5rem;letter-spacing:1px;margin-top:6px}
.tag .sn{font-family:var(--serialfont);font-size:2.2rem;font-weight:800;margin-top:6px}
.info{font-size:1.4rem;font-weight:500;line-height:1.4;margin-top:16px}
.warn{color:#e00;text-align:center;font-size:1.1rem;font-weight:600;margin-top:2px}
.set{margin-top:28px;background:#32CC33;border-radius:18px;padding:16px;text-align:left}
.set h2{margin:0 0 8px;font-size:1.05rem}
.set label{display:block;font-size:.9rem;margin:10px 0 4px}
.set input,.set select{width:100%;font:inherit;font-size:1rem;padding:8px 10px;border-radius:10px;border:1px solid rgba(0,0,0,.25);background:#fff}
.set button{margin-top:10px;font:inherit;padding:8px 12px;border-radius:10px;border:1px solid rgba(0,0,0,.25);background:#fff}
.hint{font-size:.8rem;opacity:.75;margin-top:10px}

#sidebar-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:1000;display:none;opacity:0;transition:opacity .3s ease}
#sidebar-overlay.open{display:block;opacity:1}
#sidebar{position:fixed;top:0;left:-100%;width:96%;height:100%;background:#f7f7f7;z-index:1001;overflow-y:auto;transition:left .3s ease-in-out;box-shadow:2px 0 8px rgba(0,0,0,.2);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;-webkit-overflow-scrolling:touch}
#sidebar.open{left:0}
.mdm-header{background:#1e2d3c;color:#AAAAAA;padding:calc(16px + env(safe-area-inset-top,0px)) 16px 16px;font-size:1.1rem;font-weight:600;cursor:pointer}
.mdm-group{background:#30475e;color:#fff;padding:8px 16px;font-size:.95rem;font-weight:600}
.mdm-item{padding:14px 16px;font-size:.95rem;border-bottom:1px solid #e0e0e0;color:#000;background:#fff;cursor:pointer}
.mdm-item.disabled{color:#CCCCCC}

.full-panel{position:fixed;top:0;right:-100%;width:100%;max-width:520px;height:100%;background:#fff;z-index:2001;overflow-y:auto;transition:right .3s ease-in-out;box-shadow:-2px 0 8px rgba(0,0,0,.2);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;-webkit-overflow-scrolling:touch}
.full-panel.open{right:0}
.panel-header{background:#000;color:#fff;text-align:center;font-weight:600;font-size:1.2rem;padding:calc(16px + env(safe-area-inset-top,0px)) 16px 16px;position:relative;display:flex;align-items:center;justify-content:center}
.panel-header .menu-btn{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;background:#1c1c1e;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:4px;cursor:pointer}
.panel-header .menu-btn i{display:block;width:20px;height:3px;background:#fff;border-radius:2px}
.panel-body{padding:20px;background:#fff;flex:1;overflow-y:auto;}

#recentCampPanel { display: flex; flex-direction: column; }
#recentCampPanel .panel-body { padding-bottom: 150px; position: relative; }
.recent-camp-subtitle { color: #2F6E65; font-size: 1.15rem; font-weight: 400; text-align: center; margin-bottom: 8px; }
.recent-camp-format { color: #333; font-size: 0.85rem; text-align: center; margin-bottom: 15px; border-bottom: 1px solid #ccc; padding-bottom: 12px; font-weight: 400; }
.recent-camp-item { font-size: 1.3rem; font-weight: 400; color: #000; padding: 14px 30px 14px 0; border-bottom: 1px solid #eee; text-align: left; position: relative; cursor: pointer; user-select: none; -webkit-user-select: none; }
.recent-camp-item:active { background: #f5f5f5; }
.recent-camp-check { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); color: #1E6EF3; font-size: 1.5rem; font-weight: 700; line-height: 1; }
.recent-camp-actions { position: absolute; bottom: 20px; left: 20px; right: 20px; display: flex; flex-direction: column; gap: 12px; }
.recent-camp-btn { width: 100%; background: #469D72; color: #fff; border: 0; border-radius: 10px; padding: 16px; font-size: 1.1rem; font-weight: 400; cursor: pointer; text-align: center; }
.recent-camp-del-btn { width: 100%; background: #ccc; color: #666; border: 0; border-radius: 10px; padding: 16px; font-size: 1.1rem; font-weight: 600; cursor: not-allowed; text-align: center; letter-spacing: 4px; }
.recent-camp-del-btn.active { background: #c62828; color: #fff; cursor: pointer; }

.query-form{padding:16px;background:#fff}
.form-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.form-row .label{font-size:1.1rem;font-weight:500;color:#000}
.form-row .value-tag{background:#f0f0f0;padding:6px 12px;border-radius:6px;font-size:1rem;color:#3c67f4;font-weight:500}
.form-row .version-info{text-align:right;font-size:.95rem;color:#2e7d32;font-weight:500;line-height:1.3}
.date-section-title{font-size:1rem;font-weight:500;margin:12px 0 8px;color:#000}
.date-input-row{display:flex;align-items:center;margin-bottom:10px}
.date-input-row .date-label{width:50px;font-size:1rem;font-weight:500;color:#000}
.date-input-row input{flex:1;font:inherit;font-size:.95rem;padding:10px 12px;border:1px solid #ccc;border-radius:4px;background:#fff}
.query-btn-row{display:flex;justify-content:flex-end;margin-top:12px}
.query-btn{font:inherit;font-size:1rem;padding:10px 24px;border:1px solid #3c67f4;border-radius:6px;background:#fff;color:#3c67f4;cursor:pointer}
.query-divider{border-top:1px solid #e0e0e0;margin:16px 0}
.log-list{padding:0 16px 32px}
.log-item{padding:16px 0;border-bottom:1px solid #e0e0e0}
.log-item:last-child{border-bottom:0}
.log-item .log-title{font-size:1.05rem;font-weight:400;color:#FE0000;margin-bottom:6px}
.log-item .log-time,.log-item .log-status{font-size:1rem;color:#000;margin-bottom:4px}

.loc-item{margin-bottom:24px;font-size:1.3rem;font-weight:400;color:#000;text-align:left}

.ship-section{margin-bottom:24px;text-align:left}
.ship-title{color:#2e5cfa;font-size:1.2rem;font-weight:400;margin-bottom:6px}
.ship-content{color:#000;font-size:1.05rem;line-height:1.6}

.device-card{background:#f7f7f7;border-radius:20px;padding:0 16px;margin-top:16px}
.device-row{display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-bottom:1px solid #e0e0e0}
.device-row:last-child{border-bottom:0}
.device-label{font-size:1rem;font-weight:400;color:#000}
.device-value{font-size:1rem;color:#888;text-align:right;max-width:60%}

.remind-body{height:calc(100% - 70px);position:relative}
.remind-text{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;font-size:1.1rem;font-weight:400;color:#000;line-height:1.6;width:80%}
.remind-add-btn{position:absolute;bottom:0;left:0;right:0;background:#000;color:#fff;border:0;padding:16px 24px;font-size:1.1rem;font-weight:600;text-align:right;cursor:pointer}

.bl-search-bar{display:flex;align-items:center;background:#e8e8e8;border-radius:20px;padding:10px 16px;margin:16px;}
.bl-search-icon{font-size:1.2rem;margin-right:8px;color:#888;}
.bl-search-bar input{border:0;background:transparent;outline:none;font-size:1.1rem;width:100%;color:#000;font-family:inherit;}
.bl-list{padding:0 16px;}
.bl-item{padding:20px 0;font-size:1.2rem;font-weight:600;border-bottom:1px solid #eee;color:#000;}
.bl-footer{position:absolute;bottom:16px;right:16px;font-size:.95rem;color:#000;font-weight:500;}

.modal-overlay{position:fixed;inset:0;z-index:4000;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.5);}
.modal-overlay.open{display:flex;}
.modal-card{width:80%;max-width:320px;background:#E8F7E8;border-radius:20px;padding:24px;text-align:center;box-shadow:0 4px 12px rgba(0,0,0,.15);}
.modal-title{margin:0 0 12px;font-size:1.2rem;font-weight:bold;color:#000;text-align:left;}
.modal-desc{margin:0 0 24px;font-size:1rem;color:#5C6A5D;text-align:left;line-height:1.5;font-weight:500;}
.modal-btns{display:flex;gap:12px;justify-content:center;}
.modal-btn{flex:1;padding:12px 0
